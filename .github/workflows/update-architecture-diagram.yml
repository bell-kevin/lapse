name: Update Architecture Diagram

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/architecture.mmd
  workflow_dispatch:

concurrency:
  group: architecture-diagram-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-diagram:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchronize with main
        run: git pull --ff-only origin main

      - name: Regenerate architecture diagram
        run: python scripts/generate_architecture_diagram.py

      - name: Commit diagram changes
        run: |
          if git diff --quiet -- docs/architecture.mmd; then
            echo "No architecture diagram changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.mmd
          git commit -m "chore: update architecture diagram"
          git push origin HEAD:main
